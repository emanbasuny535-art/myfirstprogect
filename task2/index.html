<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Doctor Appointment Form</h2>
<hr>

<form>

    <label>Appointment Date</label>
    <input type="date"><br><br>

    <label>Appointment Time</label>
    <input type="time"><br><br>

    <label>Name</label>
    <input type="text" placeholder="First">
    <input type="text" placeholder="Last"><br><br>

    <label>Gender</label>
    <input type="radio" name="gender" value="male"> Male
    <input type="radio" name="gender" value="female"> Female
    <br><br>

    <label>Phone</label>
    <input type="tel" placeholder="Phone"><br><br>

    <label>Address</label>
    <input type="text" placeholder="City">
    <input type="text" placeholder="State"><br><br>

    <label>Your Query</label><br>
    <textarea rows="4" cols="30"></textarea><br><br>

    <label>Appointment Type</label><br>

    Select which appointment type(s) you require<br>

    <input type="checkbox" value="cervix"> Cervix checkup<br>
    <input type="checkbox" value="heart"> Heart checkup<br>
    <input type="checkbox" value="eye"> Eye check-up<br>
    <input type="checkbox" vaue="hearing"> Hearing Test<br><br>

    <input type="submit" value="Send">

</form>
</body>
</html>
